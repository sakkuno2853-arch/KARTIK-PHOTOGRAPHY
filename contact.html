<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact & Booking | KARTIK CPN FILMS</title>
<meta name="description" content="Book a photography session or film. Send an enquiry, call, email or message us on WhatsApp.">
<meta name="theme-color" content="#0f0f10">
<meta property="og:type" content="website"><meta property="og:title" content="Contact & Booking | KARTIK CPN FILMS">
<meta property="og:description" content="Book a photography session or film. Send an enquiry, call, email or message us on WhatsApp.">
<meta property="og:image" content="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&h=630&q=75">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<main id="main">

<section class="page-hero"><div class="wrap"><span class="eyebrow">Contact</span><h1>Book a Session</h1><div class="gold-line"></div></div></section>
<section><div class="wrap contact-grid">
<div class="rv"><h2>Booking Enquiry</h2><div class="gold-line" style="margin-left:0"></div>
<form class="book" id="bookForm" novalidate>
<div class="row"><div><label for="name">Name</label><input id="name" name="name" autocomplete="name" required><div class="err" data-err="name"></div></div>
<div><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" required><div class="err" data-err="phone"></div></div></div>
<div class="row"><div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err" data-err="email"></div></div>
<div><label for="type">Event type</label><select id="type" name="type" required><option value="">Select…</option><option>Wedding</option><option>Pre-Wedding</option><option>Portrait</option><option>Fashion</option><option>Event</option><option>Commercial</option><option>Cinematic Film</option><option>Product</option></select><div class="err" data-err="type"></div></div></div>
<div class="row"><div><label for="date">Event date</label><input id="date" name="date" type="date"></div>
<div><label for="location">Location</label><input id="location" name="location"></div></div>
<div><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea></div>
<div id="formMsg" class="msg" role="status" aria-live="polite"></div>
<button class="btn solid" type="submit">Send Enquiry</button></form></div>
<div class="info rv"><h2>Get in Touch</h2><div class="gold-line" style="margin-left:0"></div>
<p><a class="btn" data-wa href="#">Chat on WhatsApp</a></p>
<p><strong>Phone:</strong> <a data-tel href="#"></a></p><p><strong>Email:</strong> <a data-mail href="#"></a></p>
<p><strong>Studio:</strong> <span data-address></span></p><p><strong>Hours:</strong> <span data-bind="contact.hours"></span></p>
<div data-render="socials"></div>
<iframe class="map" data-map title="Studio location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
</div></section>
</main>
<script src="assets/js/content.js"></script><script src="assets/js/app.js"></script>
</body></html>
